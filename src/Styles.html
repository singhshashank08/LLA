<style>
:root{--bg:#0b1020;--panel:#121a2f;--panel2:#18223d;--line:#24304f;--txt:#e6ebf5;--mut:#8b97b5;--ok:#22c55e;--bad:#f43f5e;--acc:#6366f1;--acc2:#06b6d4;--warn:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#1b2450 0,transparent 60%),var(--bg);color:var(--txt);font-size:14px}
header{padding:20px 28px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:22px;letter-spacing:.2px}h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:12.5px;margin-top:4px}
nav{position:sticky;top:0;z-index:10;background:rgba(11,16,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 28px;display:flex;gap:6px;overflow-x:auto;margin-top:14px}
nav button{background:transparent;border:1px solid var(--line);color:var(--mut);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13px}
nav button:hover{color:var(--txt);border-color:#3a4870}nav button.active{background:linear-gradient(90deg,var(--acc),#4f46e5);color:#fff;border-color:transparent}
nav button .b{display:inline-block;margin-left:6px;font-size:11px;padding:1px 6px;border-radius:999px;background:rgba(244,63,94,.18);color:#fda4af}
nav button.active .b{background:rgba(255,255,255,.2);color:#fff}nav button.ok .b{background:rgba(34,197,94,.18);color:#86efac}
main{padding:22px 28px 40px}.tab{display:none}.tab.active{display:block}
.grid{display:grid;gap:16px}.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:linear-gradient(180deg,var(--panel),#0f172b);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px}.kpi .v{font-size:30px;font-weight:700;margin-top:6px}.kpi .n{color:var(--mut);font-size:12px;margin-top:4px}
.kpi.c1 .v{color:#a5b4fc}.kpi.c2 .v{color:#86efac}.kpi.c3 .v{color:#67e8f9}.kpi.c4 .v{color:#fda4af}
h2{font-size:15px;margin:0 0 4px}.hint{color:var(--mut);font-size:12px;margin-bottom:10px}
.chartbox{position:relative;height:300px}.chartbox.tall{height:380px}
.stages{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.st{flex:1 0 120px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;transition:.15s}
.st:hover{transform:translateY(-2px);border-color:var(--acc)}.st .nm{font-size:12px;color:var(--mut)}.st .rc{font-size:20px;font-weight:700;margin:4px 0}
.bar{height:6px;border-radius:4px;background:#2a3557;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.st .dd{font-size:11.5px;margin-top:6px;display:flex;justify-content:space-between}.okc{color:#86efac}.badc{color:#fda4af}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}th:hover{color:var(--txt)}
th.sorted:after{content:" ▲";font-size:10px}th.sorted.desc:after{content:" ▼"}
tbody tr:hover{background:rgba(99,102,241,.08)}tr.click{cursor:pointer}td.num,th.num{text-align:right}
.tblwrap{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px}.p-ok{background:rgba(34,197,94,.15);color:#86efac}.p-bad{background:rgba(244,63,94,.15);color:#fda4af}.p-warn{background:rgba(245,158,11,.15);color:#fcd34d}.p-n{background:#24304f;color:#c7d2fe}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:10px;min-width:280px;outline:none}input[type=search]:focus{border-color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{background:var(--panel2);border:0;color:var(--mut);padding:8px 14px;cursor:pointer;font-size:13px}.seg button.on{background:var(--acc);color:#fff}
.btn{background:linear-gradient(90deg,#0891b2,#06b6d4);border:0;color:#fff;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-weight:500}
.cnt{color:var(--mut);font-size:12.5px;margin-left:auto}.mut{color:var(--mut)}a{color:#93c5fd;text-decoration:none}
.stagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.stagehead h2{font-size:20px}
.mini{display:flex;gap:10px;flex-wrap:wrap}.mini .card{padding:10px 14px;min-width:130px}.mini .v{font-size:20px;font-weight:700}.mini .l{font-size:11.5px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);border-radius:10px;padding:8px 12px;margin-top:10px}
footer{color:var(--mut);font-size:11.5px;padding:0 28px 24px}

/* --- Apps Script additions: loading / error / refresh --- */
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hdr-actions{display:flex;gap:8px;align-items:center}
.upd{color:var(--mut);font-size:12px}
.btn[disabled]{opacity:.55;cursor:wait}
#loader{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(11,16,32,.82);backdrop-filter:blur(3px)}
#loader.hide{display:none}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid #24304f;border-top-color:var(--acc2);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loader .msg{color:var(--mut);font-size:13px}
.errbox{margin:16px 28px 0;background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.45);color:#fecdd3;border-radius:12px;padding:12px 16px;font-size:13px;white-space:pre-wrap}
.errbox.hide{display:none}
.warnbox{margin-top:10px}
</style>
